<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project: Sign-up Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <section id="background">
            <img class="backgroundImg" src="img/forestJohnTowner.jpg" alt="">
            <div id="odinTextBlock">
                <img class="textImg" src="img/odinLogo.png" alt="">
                <p class="text">Odin</p>
            </div>
    </section>

    <section id="user">
        <div class="userDescription">
            <p class="userD1">This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up now to get started.</p>
            <p class="userD2">You know you want to.</p>
            
        </div>

        <div class="userForm">
            <form>
                <p class="textAboveWidgets">Let's do this!</p>
                <div class="form-controls">
                    <div>
                        <label for="first-name">First Name:</label>
                        <input type="text" id="first-name" name="first-name">
                    </div>
                    <div>
                        <label for="last-name">Last Name:</label>
                        <input type="text" id="last-name" name="last-name">
                    </div>
                    <div>
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email">
                    </div>
                    <div>
                        <label for="telephone">Phone Number:</label>
                        <input type="tel" id="telephone" name="telephone">
                    </div>
                    <div>
                        <label for="password">Password:</label>
                        <input type="password" id="password" name="password">
                    </div>
                    <div>
                        <label for="pw-confirm">Confirm Password:</label>
                        <input type="password" id="pw-confirm" name="pw-confirm">
                    </div>
                </div>

                <div class="form-end">
                    <button type="submit">Create Account</button>
                    <p>Already have an account? <a href="">Log in</a></p>
                </div>


            </form>

    </section>



    
</body>
</html>
